<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/cleant.png">
    <title>TAWSILA GO - الرئيسية</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            padding-bottom: 40px;
        }

        .app-header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 20px;
            display: flex;
            justify-content: flex-end;
        }

        .user-menu button,
        .panel-wrapper button {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .user-menu button:hover {
            background-color: #059669;
        }

        .main-container {
            max-width: 480px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .map-card-container {
            width: 100%;
            height: 250px;
            border: 2px solid #10b981;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #e2e8f0;
            cursor: pointer;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .map-overlay-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.9);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }

        .map-card-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            z-index: 1000;
            border-radius: 0;
            border: none;
        }

        .map-card-container.fullscreen .map-overlay-hint {
            display: none;
        }

        .close-fullscreen-btn {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1001;
            cursor: pointer;
        }

        .map-card-container.fullscreen .close-fullscreen-btn {
            display: block;
        }

        .panel-wrapper {
            width: 100%;
            background: #ffffff;
            border: 2px solid #10b981;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            padding: 20px;
        }

        .panel-header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        #map-logo {
            width: 28px;
            height: auto;
        }

        .panel-header-section span {
            font-size: 14px;
            color: #10b981;
            font-weight: 700;
        }

        .panel-content h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #request-ride-btn,
        #cancel-search-btn,
        #cancel-active-ride-btn {
            width: 100%;
            margin-top: 10px;
        }

        #cancel-search-btn,
        #cancel-active-ride-btn {
            background-color: #ef4444;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="user-menu">
            <button type="button" id="profile-btn">الملف الشخصي</button>
            <button type="button" id="history-btn">سجل الرحلات</button>
            <button type="button" id="logout-btn">خروج</button>
        </div>
    </header>

    <main class="main-container">
        <div class="map-card-container" id="map-card" onclick="toggleMapFullscreen(event)">
            <button type="button" class="close-fullscreen-btn" onclick="closeFullscreen(event)">إغلاق التكبير ✕</button>
            <div id="map"></div>
            <div class="map-overlay-hint">انقر لتكبير الخريطة</div>
        </div>

        <div class="panel-wrapper">
            <div class="panel-header-section">
                <img src="images/cleant.png" alt="Logo" id="map-logo">
                <span>هيا حدد وجهتك</span>
            </div>

            <!-- واجهة طلب الرحلة -->
            <div id="ride-request-panel" class="panel-content">
                <h2>إلى أين تريد الذهاب؟</h2>
                <form id="ride-form" onsubmit="event.preventDefault(); requestRide();">
                    <div class="input-group">
                        <label>نقطة الانطلاق</label>
                        <input type="text" id="pickup-input" value="موقعك الحالي" readonly>
                    </div>
                    <div class="input-group">
                        <label>الوجهة المقصودة (المكان)</label>
                        <input type="text" id="destination-input" placeholder="أدخل اسم المكان أو انقر على الخريطة...">
                    </div>
                    <div class="input-group">
                        <label>السعر المقترح (دج)</label>
                        <input type="number" id="bidding-price" placeholder="مثال: 400">
                    </div>
                    <button type="submit" id="request-ride-btn">بحث عن سائق</button>
                </form>
            </div>

            <!-- شاشة انتظار السائق -->
            <div id="waiting-bids-view" class="panel-content" style="display: none;">
                <h2>حالة الطلب</h2>
                <p id="search-status-text" style="color: #10b981; font-weight: bold; margin-bottom: 15px;">جاري إرسال
                    الطلب للسائقين المتاحين...</p>
                <button type="button" id="cancel-search-btn">إلغاء الطلب</button>
            </div>

            <!-- شاشة الرحلة النشطة (عندما يقبل السائق) -->
            <div id="active-ride-view" class="panel-content" style="display: none;">
                <h2>حالة الرحلة</h2>
                <p id="ride-status-message" style="color: #10b981; font-weight: bold; margin-bottom: 10px;">وافق السائق
                    على طلبك وهو في طريقه إليك!</p>
                <div
                    style="background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0;">
                    <p style="margin-bottom: 5px;">اسم السائق: <span id="active-driver-name"
                            style="font-weight: bold;">-</span></p>
                    <p style="margin-bottom: 5px;">رقم الهاتف: <span id="active-driver-phone">-</span></p>
                    <a id="driver-call-btn" href="tel:"
                        style="display:inline-block; margin-top:5px; background:#10b981; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px;">اتصال
                        بالسائق</a>
                </div>
                <button type="button" id="cancel-active-ride-btn">إلغاء الرحلة</button>
            </div>
        </div>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
        function toggleMapFullscreen(event) {
            if (event.target.classList.contains('close-fullscreen-btn')) return;
            const mapContainer = document.getElementById('map-card');
            if (!mapContainer.classList.contains('fullscreen')) {
                mapContainer.classList.add('fullscreen');
                if (window.mapInstance) setTimeout(() => window.mapInstance.resize(), 100);
            }
        }
        function closeFullscreen(event) {
            event.stopPropagation();
            const mapContainer = document.getElementById('map-card');
            mapContainer.classList.remove('fullscreen');
            if (window.mapInstance) setTimeout(() => window.mapInstance.resize(), 100);
        }
    </script>
    <script type="module" src="cleant-home.js"></script>
</body>

</html>

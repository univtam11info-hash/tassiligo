<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>TAWSILA GO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@600;700&family=Readex+Pro:wght@600;700&family=Tajawal:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- ربط ملف الmanifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="front1">
        <section class="front">
            <div class="logo">
                <img src="images/care.png" alt="Logo" width="25" height="25">
            </div>
            <h1>مرحبا بك في توصيلا غو</h1>
            <p>اختر نوع الحساب الذي تريد التسجيل به</p>
        </section>
        <div class="buttons-container">

            <a href="driver.html" class="taxior">
                <div class="icon-box"><i class="fa-solid fa-taxi"></i></div>
                <div class="card-text">
                    <h3>انضم مع توصيلا غو كسائق</h3>
                    <p>اربح معنا كشريك</p>
                </div>
            </a>
            <a href="cleant.html" class="cleant">
                <div class="icon-box"><i class="fa-solid fa-user"></i></div>
                <div class="card-text">
                    <h3>سجل كزبون</h3>
                    <p>اطلب رحلتك الآمنة والسريعة الآن</p>
                </div>
            </a>
        </div>
    </main>

    <!-- تسجيل السيرفيس ووركر لجعل الموقع قابلاً للتثبيت -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('Service Worker registered! 🎉', reg))
                    .catch((err) => console.log('Service Worker failed ❌', err));
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tassili.go - تاسيلي جو</title>
    <style>
        body {
            background-color: #ffffff;
            /* خلفية بيضاء */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* حاوية الشعار الرئيسي في المنتصف */
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        /* تأثير العوم (الطفو) المستمر للشعار */
        .center-container img {
            width: 270px;
            /* شعار بحجم أكبر وأوضح */
            height: auto;
            margin-bottom: 25px;
            animation: floatLogo 3s ease-in-out infinite;
        }

        h1 {
            font-size: 34px;
            color: #0d1b2a;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }

        p {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* تصميم شريط التحميل الجمالي باللون الأخضر المتناسق مع الهوية */
        .loader-bar {
            width: 180px;
            height: 4px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background-color: #2ec4b6;
            /* لون أخضر جذاب ومتناسق مع هوية التطبيق */
            border-radius: 4px;
            animation: fillProgress 7s linear forwards;
        }

        /* الحركات (Animations) */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes floatLogo {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            /* يرتفع للأعلى قليلاً */
            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fillProgress {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- الشعار في المنتصف مع تأثير الطفو -->
    <div class="center-container">
        <img src="images/logo2.png" alt="Tassili.go Logo 2">
        <h1>Tassili.go</h1>
        <p>جاري تحضير رحلتك...</p>

        <!-- شريط التحميل الجمالي بالأخضر يعبّر عن مدة الانتظار (7 ثواني) -->
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <script>
        // الانتقال تلقائياً بعد 7 ثوانٍ إلى صفحة driverdash.html
        setTimeout(function () {
            window.location.href = "driverdash.html";
        }, 7000); // 7000 ملي ثانية = 7 ثوانٍ
    </script>

</body>

</html>
